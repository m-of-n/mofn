site_name: m-of-n
site_description: Key-centric semantic assertions — authorization, local names, and artifact attestation
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: light mode}
  features: [navigation.sections, navigation.top, content.code.copy, toc.follow]
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
nav:
  - Home: index.md
  - Limitations: LIMITATIONS.md
  - Architecture:
      - Source of truth (ARCH-0001): architecture/ARCH-0001-authorization-attestation.md
      - Changelog: architecture/ARCH-0001-CHANGELOG.md
      - Open proposal v0.2.0: architecture/ARCH-0001-PROPOSAL-v0.2.0.md
  - Planning:
      - Plan: architecture/PLAN-0001-project-plan.md
      - Backlog: architecture/BACKLOG-0001.md
      - Agents and topics: architecture/PROC-0001-agents-and-topics.md
  - Library:
      - Construction method: library/construction.md
  - Download: download.md
