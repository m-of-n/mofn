site_name: m-of-n
site_url: https://m-of-n.github.io/mofn/
site_description: Key-centric Semantic Attestations — authorization, local names, and artifact attestation
theme:
  name: material
  # Template overrides (status banner) — outside docs/, so not staged.
  custom_dir: site-src/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-night, name: dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-sunny, name: light mode}
  features: [navigation.sections, navigation.top, navigation.indexes, content.code.copy, toc.follow, search.highlight]
# Authored in site-src/assets/, staged into docs/assets/ by bin/build-site.
extra_css: [assets/extra.css]
repo_url: https://github.com/m-of-n/mofn
validation:
  links: {anchors: warn}
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
# nav is GENERATED — see mkdocs.nav.yml, produced by bin/manifest
INHERIT: mkdocs.nav.yml
