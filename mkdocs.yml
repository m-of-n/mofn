site_name: m-of-n
site_description: Key-centric semantic assertions — authorization, local names, and artifact attestation
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: light mode}
  features: [navigation.sections, navigation.top, content.code.copy, toc.follow]
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
# nav is GENERATED — see mkdocs.nav.yml, produced by bin/manifest
INHERIT: mkdocs.nav.yml
