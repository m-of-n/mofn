name: ci
on:
  pull_request:
  push: {branches: [main]}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 2}
      - name: archdoc/v1 contract
        run: bin/validate-archdoc
      - name: library submodule pin is intentional
        run: bin/lib-sync --check
      - name: library records validate
        run: cd library && bin/validate
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: site builds (strict - catches broken doc links)
        run: pip install -q mkdocs-material && bin/build-site
      - name: library derived views are up to date
        run: |
          cd library
          # Tolerate submodule version skew: run whichever generators the
          # PINNED library actually has. A pin predating a tool must not fail
          # the build for a tool it has never heard of.
          paths=""
          [ -x bin/export ]  && { bin/export;  paths="$paths exports/"; }
          [ -x bin/reindex ] && { bin/reindex; paths="$paths index/"; }
          [ -n "$paths" ] || { echo "no generators in pinned library — skipping"; exit 0; }
          git diff --exit-code -- $paths || {
            echo "::error::stale derived views in library ($paths) — regenerate and commit"; exit 1; }
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: every commit signed off
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          fail=0
          while read -r sha; do
            git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>' \
              || { echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"; fail=1; }
          done < <(git rev-list "$base..$head")
          exit $fail
