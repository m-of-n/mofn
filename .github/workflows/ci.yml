name: ci
on:
  pull_request:
  push: {branches: [main]}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 2}
      - name: archdoc/v1 contract
        run: bin/validate-archdoc
      - name: library submodule pin is intentional
        run: bin/lib-sync --check
      - name: library records validate
        run: cd library && bin/validate
      - name: library exports are up to date
        run: |
          cd library && bin/export
          git diff --exit-code -- exports/ || {
            echo "::error::exports/ is stale — run 'cd library && bin/export' and commit"; exit 1; }
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: every commit signed off
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          fail=0
          while read -r sha; do
            git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>' \
              || { echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"; fail=1; }
          done < <(git rev-list "$base..$head")
          exit $fail
