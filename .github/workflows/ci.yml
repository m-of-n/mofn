name: ci
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:   # library-update runs CI on bot-opened pin-bump PRs
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 2}
      - name: archdoc/v1 contract
        run: bin/validate-archdoc
      - name: library submodule pin is intentional
        run: bin/lib-sync --check
      - name: library records validate
        run: cd library && bin/validate
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: site builds (strict - catches broken doc links)
        run: |
          pip install -q -r requirements-docs.txt
          bin/build-site
      - name: tracked nav and manifest match what the generators produce
        # build-site regenerates mkdocs.nav.yml and PUBLISHING.md in this
        # checkout, so a stale tracked copy would otherwise pass unseen. mofn#57
        # committed a nav with the Library section dropped; the live site was
        # fine only because Pages regenerates it (mofn#61).
        run: |
          git diff --exit-code -- mkdocs.nav.yml project/PUBLISHING.md || {
            echo "::error::tracked nav/manifest is stale — run bin/build-site (or: library views, then bin/manifest) and commit"; exit 1; }
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: every commit signed off
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          fail=0
          while read -r sha; do
            git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>' \
              || { echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"; fail=1; }
          done < <(git rev-list "$base..$head")
          exit $fail
